<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0c2a66">
<title>관리자 · 우리동네 아파트 안심.ZIP</title>
<link rel="icon" href="app-icon-192.png">
<style>
:root{--bg:#eaf1fb;--surface:#fff;--ink:#0c2a66;--muted:#51638a;--line:#c4d3ea;--alert:#c8202f;--safe:#0b6e5b;--safe-bg:#e1f3ee;--warn:#8a5a00;--warn-bg:#fdf0d2;--primary:#0c2a66;--primary-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1626;--surface:#17233a;--ink:#eaf0f8;--muted:#a3b0c4;--line:#2b3a55;--alert:#ff5a66;--safe:#5fd6b9;--safe-bg:#12352d;--warn:#f2c35b;--warn-bg:#3a2d0c;--primary:#eaf0f8;--primary-ink:#0e1626;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:0 max(16px,env(safe-area-inset-left)) 40px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:18px 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-height:44px}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
button{font:inherit;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.p{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
button.d{color:var(--alert);border-color:var(--alert)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--warn-bg);color:var(--warn)}
.badge.on{background:var(--safe-bg);color:var(--safe)}
.msg{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.msg.ok{background:var(--safe-bg);color:var(--safe)}
.frow{display:grid;grid-template-columns:90px 130px 1fr 44px;gap:6px;margin-top:6px}
@media (max-width:560px){.frow{grid-template-columns:1fr 1fr}.frow input:nth-child(3){grid-column:1/3}}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}.chk input{width:auto;min-height:0}
</style></head><body><div class="wrap" id="app"><p class="muted" style="margin-top:20px">불러오는 중입니다.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://gsiyqmoebzhahivzbmio.supabase.co",SB_KEY="sb_publishable_Dt_CqrpsWnbzXCHlkg5F1Q_umYLMuxx";
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var sb=null,ME=null,ST={view:"list",cid:null,bid:null,regions:[],complexes:[],msg:null};
var KINDS=["경량칸막이","대피공간","하향식 피난구","없음","해당 없음","확인 필요"];
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function msg(t,ok){return t?'<div class="msg'+(ok?' ok':'')+'" role="status">'+esc(t)+'</div>':''}
function setMsg(t,ok){var m=$("m");if(m)m.innerHTML=msg(t,ok)}
function errT(e){return (e&&e.message)?e.message:"오류가 발생했습니다."}
function v(id){var e=$(id);return e?e.value.trim():""}
function nz(x){return x===""?null:x}
function hdr(){return '<div class="top"><h1>우리동네 아파트 안심.ZIP 관리자</h1><div><span class="muted">'+esc(ME.email)+' · '+(ME.role==="super"?"소방본부 담당":esc(ME.station||"")+" 담당")+'</span> <button id="out">로그아웃</button></div></div>'}
function loginView(m){
  $("app").innerHTML='<h1>관리자 로그인</h1><div class="card"><label for="em">이메일</label><input id="em" type="email" autocomplete="username"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="p" id="login">로그인</button></div><div id="m">'+msg(m)+'</div></div><p class="muted">관리자 계정은 소방서 담당자에게만 발급됩니다.</p>';
  $("login").onclick=doLogin;$("pw").onkeydown=function(e){if(e.key==="Enter")doLogin()}}
function doLogin(){setMsg("확인하는 중입니다.");sb.auth.signInWithPassword({email:v("em"),password:$("pw").value}).then(function(r){if(r.error)return setMsg("이메일이나 비밀번호가 맞지 않습니다.");start()})}
function start(){
  sb.auth.getSession().then(function(r){var s=r.data.session;if(!s)return loginView();
    sb.from("admins").select("role,station").eq("user_id",s.user.id).maybeSingle().then(function(a){
      if(a.error||!a.data){ME=null;$("app").innerHTML='<h1>권한 없음</h1><div class="card"><p>이 계정은 관리자로 등록되지 않았습니다. 소방서 담당자에게 문의해 주세요.</p><button id="out">로그아웃</button></div>';$("out").onclick=logout;return}
      ME={email:s.user.email,role:a.data.role,station:a.data.station};ST.view="list";load()})})}
function logout(){sb.auth.signOut().then(function(){ME=null;loginView()})}
function load(){
  Promise.all([sb.from("regions").select("id,name").order("sort").order("name"),sb.from("complexes").select("id,region_id,name,address,fire_station,info,published").order("name")]).then(function(r){
    if(r[0].error||r[1].error)return draw(errT(r[0].error||r[1].error));
    ST.regions=r[0].data;ST.complexes=r[1].data.filter(function(c){return ME.role==="super"||c.fire_station===ME.station});draw()})}
function regName(id){var r=ST.regions.filter(function(x){return x.id===id})[0];return r?r.name:""}
function draw(m){ST.msg=m||null;if(ST.view==="list")listView();else if(ST.view==="complex")complexView();else dongView()}
function listView(){
  var h=hdr()+msg(ST.msg)+'<div class="card"><div class="top"><h2>아파트 단지</h2><button class="p" id="addc">+ 아파트 추가</button></div>';
  if(!ST.complexes.length)h+='<p class="muted">등록된 단지가 없습니다. 아파트를 추가해 주세요.</p>';
  ST.complexes.forEach(function(c){h+='<div class="item"><div><b>'+esc(c.name)+'</b> <span class="badge'+(c.published?' on':'')+'">'+(c.published?'공개 중':'비공개')+'</span><div class="muted">'+esc(regName(c.region_id))+' · '+esc(c.fire_station||"담당 서 미지정")+'</div></div><button data-c="'+c.id+'">열기</button></div>'});
  h+='</div>';
  if(ME.role==="super")h+='<div class="card"><h2>시·군·구 추가</h2><div class="row" style="margin-top:0"><input id="nr" placeholder="예: 곡성군" style="flex:1"><button id="addr">추가</button></div><p class="muted">등록된 시·군·구: '+ST.regions.map(function(r){return esc(r.name)}).join(", ")+'</p></div>';
  $("app").innerHTML=h;$("out").onclick=logout;
  $("addc").onclick=function(){ST.cid=null;ST.view="complex";draw()};
  Array.prototype.forEach.call(document.querySelectorAll("[data-c]"),function(b){b.onclick=function(){ST.cid=+b.getAttribute("data-c");ST.view="complex";draw()}});
  if($("addr"))$("addr").onclick=function(){var n=v("nr");if(!n)return;sb.from("regions").insert({name:n,sort:ST.regions.length+1}).then(function(r){if(r.error)return draw(errT(r.error));load()})}}
function genCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",b=new Uint8Array(8);crypto.getRandomValues(b);var s="";for(var i=0;i<8;i++)s+=a[b[i]%a.length];return s.slice(0,4)+"-"+s.slice(4)}
function complexView(){
  var c=ST.complexes.filter(function(x){return x.id===ST.cid})[0]||{info:{},published:false,fire_station:ME.role==="station"?ME.station:""};
  var i=c.info||{};
  var h=hdr()+'<div class="row" style="margin-top:8px"><button id="back">← 목록</button></div><div id="m">'+msg(ST.msg,ST.msgok)+'</div><div class="card"><h2>'+(c.id?'단지 정보':'아파트 추가')+'</h2><div class="grid">'+
   '<div><label for="cn">아파트 이름</label><input id="cn" value="'+esc(c.name)+'"></div>'+
   '<div><label for="cr">시·군·구</label><select id="cr">'+ST.regions.map(function(r){return '<option value="'+r.id+'"'+(r.id===c.region_id?' selected':'')+'>'+esc(r.name)+'</option>'}).join("")+'</select></div>'+
   '<div><label for="ca">주소</label><input id="ca" value="'+esc(c.address)+'"></div>'+
   '<div><label for="cs">담당 소방서</label><input id="cs" value="'+esc(c.fire_station)+'"'+(ME.role==="station"?' readonly':'')+' placeholder="예: 구례소방서"></div>'+
   '<div><label for="cb">사용승인일</label><input id="cb" type="date" value="'+esc(i.built)+'"></div>'+
   '<div><label for="co">관리사무소 연락처</label><input id="co" value="'+esc(i.office)+'"></div>'+
   '<div><label for="ct">소방차 전용구역 위치</label><input id="ct" value="'+esc(i.truck)+'"></div>'+
   '<div><label for="cm">소방안전관리자</label><input id="cm" value="'+esc(i.mgr)+'"></div></div>'+
   '<div class="chk"><input type="checkbox" id="cp"'+(c.published?' checked':'')+'><label for="cp" style="margin:0;color:inherit">주민에게 공개</label></div>'+
   '<div class="row"><button class="p" id="savec">저장</button>'+(c.id&&ME.role==="super"?'<button class="d" id="delc">단지 삭제</button>':'')+'</div></div>';
  if(c.id)h+='<div class="card"><h2>입주민 전용 정보</h2><p class="muted">옥상 열쇠 보관 위치는 가입코드를 입력한 주민에게만 보입니다.</p><div class="grid"><div><label for="jc">단지 가입코드</label><input id="jc" autocomplete="off"></div><div><label for="kl">열쇠 보관 위치</label><input id="kl"></div></div><div class="row"><button id="gen">코드 새로 만들기</button><button class="p" id="sevs">저장</button></div></div><div class="card"><div class="top"><h2>동 목록</h2><button class="p" id="addb">+ 동 추가</button></div><div id="bl"><p class="muted">불러오는 중입니다.</p></div></div>';
  $("app").innerHTML=h;$("out").onclick=logout;$("back").onclick=function(){ST.view="list";draw()};
  $("savec").onclick=function(){saveComplex(c)};
  if($("delc"))$("delc").onclick=function(){if(confirm("이 단지와 모든 동 정보를 삭제할까요? 되돌릴 수 없습니다.")){sb.from("complexes").delete().eq("id",c.id).then(function(r){if(r.error)return draw(errT(r.error));ST.view="list";load()})}};
  if(c.id){
    sb.from("complex_secrets").select("join_code,key_location").eq("complex_id",c.id).maybeSingle().then(function(r){if(r.data){$("jc").value=r.data.join_code||"";$("kl").value=r.data.key_location||""}});
    $("gen").onclick=function(){$("jc").value=genCode()};
    $("sevs").onclick=function(){var code=v("jc").toUpperCase();if(!code)return setMsg("가입코드를 입력하거나 새로 만들어 주세요.");
      sb.from("complex_secrets").upsert({complex_id:c.id,join_code:code,key_location:nz(v("kl"))}).then(function(r){setMsg(r.error?errT(r.error):"입주민 전용 정보를 저장했습니다.",!r.error)})};
    sb.from("buildings").select("id,name,info").eq("complex_id",c.id).order("name").then(function(r){
      ST.buildings=r.data||[];var b=$("bl");if(!b)return;
      b.innerHTML=ST.buildings.length?ST.buildings.map(function(x){var i=x.info||{};return '<div class="item"><div><b>'+esc(x.name)+'</b> <span class="badge'+(i.roof||i.floors?' on':'')+'">'+(i.roof||i.floors?'입력됨':'미입력')+'</span><div class="muted">확인일 '+esc(i.updated||"-")+'</div></div><button data-b="'+x.id+'">열기</button></div>'}).join(""):'<p class="muted">등록된 동이 없습니다.</p>';
      Array.prototype.forEach.call(b.querySelectorAll("[data-b]"),function(k){k.onclick=function(){ST.bid=+k.getAttribute("data-b");ST.view="dong";draw()}})});
    $("addb").onclick=function(){ST.bid=null;ST.view="dong";draw()}}}
function saveComplex(c){
  var name=v("cn");if(!name)return setMsg("아파트 이름을 입력해 주세요.");
  var info=Object.assign({},c.info||{},{built:v("cb"),office:v("co"),truck:v("ct"),mgr:v("cm")});
  var row={name:name,region_id:+v("cr"),address:nz(v("ca")),fire_station:nz(v("cs")),info:info,published:$("cp").checked,updated_at:new Date().toISOString()};
  var q=c.id?sb.from("complexes").update(row).eq("id",c.id).select().single():sb.from("complexes").insert(row).select().single();
  q.then(function(r){if(r.error)return setMsg(r.error.code==="23505"?"같은 이름의 단지가 이미 있습니다.":errT(r.error));
    ST.cid=r.data.id;ST.msgok=true;Promise.all([sb.from("complexes").select("id,region_id,name,address,fire_station,info,published").order("name")]).then(function(x){ST.complexes=x[0].data.filter(function(c){return ME.role==="super"||c.fire_station===ME.station});ST.view="complex";draw("저장했습니다.")})})}
function dongView(){
  var b=(ST.buildings||[]).filter(function(x){return x.id===ST.bid})[0]||{name:"",info:{}};
  var i=b.info||{},e=i.extra||{},fl=(i.floors&&i.floors.length)?i.floors:[["","확인 필요",""]];
  ST.rows=fl.map(function(r){return r.slice()});
  function fld(id,l,val,ph){return '<div><label for="'+id+'">'+l+'</label><input id="'+id+'" value="'+esc(val)+'"'+(ph?' placeholder="'+ph+'"':'')+'></div>'}
  var h=hdr()+'<div class="row" style="margin-top:8px"><button id="back">← 단지로</button></div><div id="m">'+msg(ST.msg)+'</div><div class="card"><h2>'+(b.id?esc(b.name)+' 정보':'동 추가')+'</h2><div class="grid">'+
   fld("dn","동 이름",b.name,"예: 101동")+
   '<div><label for="dr">지붕 형태</label><select id="dr">'+["","평지붕","박공지붕","경사지붕","확인 필요"].map(function(o){return '<option'+(o===(i.roof||"")?' selected':'')+'>'+o+'</option>'}).join("")+'</select></div>'+
   fld("df","옥상 대피공간",i.refuge,"예: 옥상 중앙에 있음 / 없음")+fld("dd","옥상 출입문",i.door,"예: 설치됨 · 15층 계단 끝")+
   '<div><label for="do">출입문 개방 방식</label><select id="do">'+[["","미등록"],["auto","자동으로 열림"],["none","평소 잠김"],["unknown","확인 필요"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===(i.opener||"")?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select></div>'+
   fld("dm","개방 방식 설명",i.openerNote)+fld("dx","장애요인",i.obstacle,"예: 없음 / 계단 끝에 적치물")+fld("du","정보 확인일",i.updated||today())+'</div>'.replace('','')+
   '<h3>층 구간별 세대 대피시설</h3><div id="rows"></div><button id="addrow" style="margin-top:8px">구간 추가</button>'+
   '<h3>소방시설 위치</h3><div class="grid">'+fld("ey","옥내소화전",e.hyd)+fld("es","스프링클러",e.sprk)+fld("ep","화재 수신반",e.panel)+fld("et","계단",e.stairs)+fld("eh","복도 형태",e.hall)+fld("el","승강기",e.elev)+'</div>'+
   '<div class="row"><button class="p" id="saved">저장</button>'+(b.id?'<button class="d" id="delb">동 삭제</button>':'')+'</div></div>';
  $("app").innerHTML=h;$("out").onclick=logout;
  $("du").type="date";
  $("back").onclick=function(){ST.view="complex";draw()};
  function rows(){$("rows").innerHTML=ST.rows.map(function(r,k){return '<div class="frow"><input aria-label="층 구간" data-r="'+k+'" data-c="0" value="'+esc(r[0])+'" placeholder="예: 4~15층"><select aria-label="시설 종류" data-r="'+k+'" data-c="1">'+KINDS.map(function(o){return '<option'+(o===r[1]?' selected':'')+'>'+o+'</option>'}).join("")+'</select><input aria-label="위치와 비고" data-r="'+k+'" data-c="2" value="'+esc(r[2])+'" placeholder="위치·비고"><button data-x="'+k+'" aria-label="구간 삭제">×</button></div>'}).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#rows [data-r]"),function(el){el.onchange=function(){ST.rows[+el.getAttribute("data-r")][+el.getAttribute("data-c")]=el.value}});
    Array.prototype.forEach.call(document.querySelectorAll("#rows [data-x]"),function(el){el.onclick=function(){ST.rows.splice(+el.getAttribute("data-x"),1);rows()}})}
  rows();$("addrow").onclick=function(){ST.rows.push(["","확인 필요",""]);rows()};
  $("saved").onclick=function(){
    var n=v("dn");if(!n)return setMsg("동 이름을 입력해 주세요.");
    var fls=ST.rows.filter(function(r){return r[0]});
    var info={roof:nz(v("dr")),refuge:nz(v("df")),door:nz(v("dd")),opener:nz(v("do")),openerNote:nz(v("dm")),obstacle:nz(v("dx")),updated:nz(v("du")),floors:fls.length?fls:null,extra:{hyd:nz(v("ey")),sprk:nz(v("es")),panel:nz(v("ep")),stairs:nz(v("et")),hall:nz(v("eh")),elev:nz(v("el"))}};
    var row={complex_id:ST.cid,name:n,info:info,updated_at:new Date().toISOString()};
    var q=b.id?sb.from("buildings").update(row).eq("id",b.id):sb.from("buildings").insert(row);
    q.then(function(r){if(r.error)return setMsg(errT(r.error));ST.view="complex";ST.msgok=true;draw("동 정보를 저장했습니다.")})};
  if($("delb"))$("delb").onclick=function(){if(confirm("이 동 정보를 삭제할까요?"))sb.from("buildings").delete().eq("id",b.id).then(function(r){if(r.error)return setMsg(errT(r.error));ST.view="complex";draw("삭제했습니다.")})}}
if(window.supabase){sb=window.supabase.createClient(SB_URL,SB_KEY);start()}else $("app").innerHTML='<h1>관리자</h1><div class="card"><p>필요한 구성 요소를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</p></div>';
</script></body></html>
